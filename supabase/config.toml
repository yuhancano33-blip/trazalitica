# Configuración de Supabase local (Supabase CLI). Referencia: https://supabase.com/docs/guides/local-development/cli/config
project_id = "trazalitica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Debe coincidir con la versión del proyecto remoto (Specs: PostgreSQL 15+)
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Access token de vida corta (Spec 8): 15 minutos
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
# En local no se exige confirmación por correo; en producción sí.
enable_confirmations = false
secure_password_change = true

# MFA TOTP para quienes firman gates (Spec 6)
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
